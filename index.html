<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>装甲车辆库 — 交互展示</title>
<style>
:root{--amber:#e3a72a;--ink:#e9ebec;--dim:#98a0a6;--glass:rgba(14,16,18,.78);--line:rgba(255,255,255,.12);--num:"DIN Alternate","Bahnschrift","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0c0d;color:var(--ink);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hud{position:absolute;pointer-events:none;z-index:5}
.hud *{pointer-events:auto}
/* title */
#title{left:28px;top:24px}
#title .k{font:600 11px/1 var(--num);letter-spacing:.18em;color:var(--amber)}
#title h1{margin:8px 0 2px;font-size:26px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#title .s{color:var(--dim);font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
/* general spec panel */
#spec{left:28px;top:118px;width:260px;background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
#spec header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;font-weight:600}
#spec header i{font-style:normal;color:var(--dim);transition:transform .25s}
#spec.open header i{transform:rotate(90deg)}
#spec .rows{max-height:0;transition:max-height .35s ease;border-top:1px solid transparent}
#spec.open .rows{max-height:400px;border-top-color:var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}.row span:first-child{color:var(--dim);white-space:nowrap}.row span:last-child{text-align:right}
/* toolbar */
#tools{right:24px;top:24px;display:flex;gap:8px}
.btn{background:var(--glass);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:7px 11px;font:inherit;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none;display:flex;gap:7px;align-items:center}
.btn:hover{border-color:rgba(255,255,255,.3)}.btn.on{border-color:var(--amber);color:var(--amber)}
kbd{font:600 10px/1 var(--num);border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:3px;padding:3px 5px;color:var(--dim);background:rgba(255,255,255,.04)}
/* speedo */
#drive{left:28px;bottom:26px;display:grid;grid-template-columns:auto auto auto;align-items:flex-end;column-gap:16px;row-gap:12px}
#speed{font:700 54px/0.9 var(--num);min-width:74px;text-align:right;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#drive .u{color:var(--dim);font:600 11px/1.3 var(--num);letter-spacing:.12em}
#gear{display:inline-block;margin-top:6px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;font-weight:600;background:var(--glass)}
#gear.f{color:#7fd08a;border-color:#3f7a48}#gear.r{color:#e58a6a;border-color:#8a4a36}
#trk{grid-row:2;display:flex;gap:4px;height:44px;align-items:center}
#trk b{display:block;width:6px;height:44px;background:rgba(255,255,255,.1);border-radius:2px;position:relative;overflow:hidden}
#trk b i{position:absolute;left:0;right:0;top:50%;height:0;background:var(--amber)}
/* dock: key hints + vehicle selector */
#dock{left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#hints{display:flex;gap:14px;white-space:nowrap;color:var(--dim);font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#hints span{display:flex;gap:5px;align-items:center}#hints b{font-weight:400}
#sel{display:flex;gap:8px}
.veh{display:grid;grid-template-columns:auto 1fr;column-gap:9px;align-items:center;text-align:left;min-width:150px;padding:8px 12px;background:var(--glass);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,transform .2s}
.veh kbd{grid-row:1 / 3;font-size:13px;padding:5px 7px}.veh .nm{font-weight:600;white-space:nowrap}.veh .kd{font-size:11px;color:var(--dim);white-space:nowrap}
.veh:hover{border-color:rgba(255,255,255,.35)}.veh.on{border-color:var(--amber);transform:translateY(-3px)}.veh.on .nm{color:var(--amber)}
.veh.wait .kd::after{content:" · 加载中…";color:var(--amber)}
/* turret dial */
#turret{grid-row:1;grid-column:1 / 4;justify-self:start;display:flex;gap:10px;align-items:center;padding:7px 12px 7px 9px;background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tdial{position:relative;width:42px;height:42px;border:1px solid rgba(255,255,255,.3);border-radius:50%}
#tdial .hullmark{position:absolute;left:50%;top:50%;width:14px;height:24px;margin:-12px 0 0 -7px;border:1px solid rgba(255,255,255,.45);border-radius:2px}
#tneedle{position:absolute;left:50%;top:50%;width:2px;height:20px;margin:-20px 0 0 -1px;background:var(--amber);transform-origin:50% 100%}
#tang{font:600 15px/1.3 var(--num)}#turret .u{letter-spacing:.04em;font-size:11px}
#rbar{width:120px;height:3px;margin-top:5px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}#rbar i{display:block;height:100%;width:100%;background:var(--amber)}
/* minimap */
#map{right:24px;top:72px;border:1px solid var(--line);border-radius:6px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px}
#map canvas{display:block;width:232px;height:137px}
#credit{right:24px;bottom:5px;font-size:9.5px;color:rgba(255,255,255,.35);pointer-events:none;max-width:60vw;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hotspots */
.dot{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;cursor:pointer;z-index:4;transition:opacity .25s}
.dot::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1.5px solid var(--amber);opacity:.7;animation:pulse 2.2s ease-out infinite}
.dot.on::before{background:#fff}.dot.on::after{animation:none;opacity:1;border-color:#fff}
@keyframes pulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.35);opacity:0}}
svg#leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
svg#leader path{fill:none;stroke:var(--amber);stroke-width:1.2}
#card{position:absolute;left:0;top:0;width:310px;z-index:7;pointer-events:none;background:var(--glass);border:1px solid var(--line);border-top:2px solid var(--amber);border-radius:0 0 6px 6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:0;clip-path:inset(0 0 100% 0);transition:clip-path .38s cubic-bezier(.2,.8,.2,1),opacity .2s}
#card.show{opacity:1;clip-path:inset(0 0 0 0)}
#card .hd{display:flex;gap:10px;align-items:baseline;padding:11px 14px 4px}
#card .no{font:700 22px/1 var(--num);color:var(--amber)}
#card h2{margin:0;font-size:17px}#card .en{font:600 10px/1.2 var(--num);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:0 14px}
#card p{margin:8px 14px 10px;color:#c9ced2}
#card .rows{border-top:1px solid var(--line)}
#card .row{opacity:0;transform:translateY(6px)}
#card.show .row{opacity:1;transform:none;transition:opacity .3s,transform .3s;transition-delay:calc(.12s + var(--i)*.045s)}
#card .pin{padding:6px 14px 9px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}
/* loading */
#load{position:absolute;inset:0;background:#0b0c0d;z-index:20;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
#load .bar{width:220px;height:2px;background:rgba(255,255,255,.12);overflow:hidden}#load .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
#load .t{font:600 11px/1 var(--num);letter-spacing:.2em;color:var(--dim)}
@media (max-width:1250px){#hints{display:none}}
@media (max-width:1180px){.veh .kd{display:none}.veh{min-width:0;padding:7px 10px}}
@media (max-width:820px){#map{display:none}}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none}}
</style>
</head><body>
<canvas id="c" tabindex="0"></canvas>
<svg id="leader"><path id="lead"/></svg>
<div id="dots"></div>
<div id="card"></div>

<div id="title" class="hud"><div class="k" id="tag"></div><h1 id="name"></h1><div class="s"><span id="sub"></span> · 把鼠标移到车上的标记点查看部件</div></div>
<div id="spec" class="hud open"><header><span>总体参数</span><i>›</i></header><div class="rows"></div></div>

<div id="tools" class="hud">
  <button class="btn" id="bAim">炮塔跟随视角 <kbd>T</kbd></button>
  <button class="btn" id="bFire">开火 <kbd>F</kbd></button>
  <button class="btn" id="bChase">追尾视角 <kbd>C</kbd></button>
  <button class="btn on" id="bDots">部件标记 <kbd>H</kbd></button>
  <button class="btn" id="bReset">回到车位 <kbd>R</kbd></button>
</div>

<div id="drive" class="hud">
  <div id="trk" title="左 / 右履带速度"><b><i id="tl"></i></b><b><i id="tr"></i></b></div>
  <div id="speed">0</div>
  <div><div class="u">KM/H</div><div id="gear">驻车</div></div>
  <div id="turret"><div id="tdial"><i class="hullmark"></i><i id="tneedle"></i></div><div><div class="u" id="wname"></div><div id="tang">0° / +0°</div><div id="rbar"><i id="reload"></i></div></div></div>
</div>
<div id="dock" class="hud">
  <div id="hints"><span><kbd>W</kbd><kbd>S</kbd> 前进 / 倒车</span><span><kbd>A</kbd><kbd>D</kbd> <b id="hSteer">转向</b></span><span><kbd>Shift</kbd> 加速</span><span><kbd>空格</kbd> 刹车</span><span><kbd>Q</kbd><kbd>E</kbd> 转炮塔</span><span><kbd>↑</kbd><kbd>↓</kbd> 炮管俯仰</span><span><kbd>F</kbd> 开火</span></div>
  <div id="sel"></div>
</div>
<div id="map" class="hud"><canvas id="mm" width="464" height="274"></canvas></div>
<div id="credit" class="hud">模型（Sketchfab）：M113 by arc4de · M1A2 Abrams by Jeyhun1985 · LAV-25 by 42manako (CC BY 4.0) · M3A2/M3A3 CFV by xlisov (CC BY-NC 4.0) · 贴图与 HDRI：Poly Haven (CC0)</div>

<div id="load"><div class="t" id="loadT">LOADING</div><div class="bar"><i id="loadB"></i></div></div>
<script type="module" src="app.js"></script>
</body></html>
